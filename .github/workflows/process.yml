name: Process Pune 1km Chunks v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # SYSTEM
      # ======================================================

      - name: System information
        run: |
          set -e

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h

      # ======================================================
      # OSMIUM
      # ======================================================

      - name: Install osmium-tool
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool

          echo
          osmium version

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements.txt

      # ======================================================
      # DOWNLOAD RAW PBF
      # ======================================================

      - name: Download Pune raw OSM PBF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING RAW PBF"
          echo "=========================================="

          mkdir -p raw

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw \
            --clobber

          test -f raw/central-zone.osm.pbf

          ls -lh raw/central-zone.osm.pbf

      # ======================================================
      # INPUT VALIDATION
      # ======================================================

      - name: Validate PBF
        run: |
          set -e

          echo "=========================================="
          echo "OSM FILE INFO"
          echo "=========================================="

          osmium fileinfo \
            raw/central-zone.osm.pbf \
            --extended

      # ======================================================
      # PROCESS
      # ======================================================

      - name: Process Pune 1km chunks
        run: |
          set -e

          echo "=========================================="
          echo "STARTING PROCESSOR"
          echo "=========================================="

          python -u processor.py

      # ======================================================
      # OUTPUT INSPECTION
      # ======================================================

      - name: Inspect generated chunks
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED OUTPUT"
          echo "=========================================="

          if [ -d data/chunks ]; then

            echo
            echo "Chunk count:"

            find data/chunks \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | wc -l

            echo
            echo "First chunks:"

            find data/chunks \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort \
              | head -20

            echo
            echo "Sample files:"

            find data/chunks \
              -type f \
              | sort \
              | head -50

          else

            echo "data/chunks does not exist."

          fi

      # ======================================================
      # SUMMARY
      # ======================================================

      - name: Show summary
        if: always()
        run: |
          echo "=========================================="
          echo "SUMMARY"
          echo "=========================================="

          if [ -f data/summary.json ]; then
            cat data/summary.json
          else
            echo "summary.json not found."
          fi

      # ======================================================
      # ARCHIVE
      # ======================================================

      - name: Archive information
        if: always()
        run: |
          echo "=========================================="
          echo "ARCHIVE"
          echo "=========================================="

          if [ -f pune-1km-chunks.tar.gz ]; then
            ls -lh \
              pune-1km-chunks.tar.gz
          else
            echo "Archive not found."
          fi

      # ======================================================
      # UPLOAD
      # ======================================================

      - name: Upload processed chunks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: |
            pune-1km-chunks.tar.gz
            data/grid.geojson
            data/summary.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
