name: Pune 1KM Processor v9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify source
        run: |
          set -e

          echo "=============================================="
          echo "COMMIT"
          echo "=============================================="

          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=============================================="
          echo "PROCESSOR"
          echo "=============================================="

          test -f processor.py
          ls -lh processor.py

          echo
          head -30 processor.py

      - name: Install system packages
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL SYSTEM PACKAGES"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool \
            python3 \
            python3-pip

          echo
          echo "OSMIUM:"
          osmium --version

          echo
          echo "PYTHON:"
          python3 --version

      - name: Download raw PBF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=============================================="
          echo "DOWNLOAD RAW PBF"
          echo "=============================================="

          mkdir -p raw

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw \
            --clobber

          test -s raw/central-zone.osm.pbf

          ls -lh raw/central-zone.osm.pbf

      - name: Verify raw PBF
        run: |
          set -e

          echo "=============================================="
          echo "RAW PBF INFO"
          echo "=============================================="

          osmium fileinfo \
            --extended \
            raw/central-zone.osm.pbf

      - name: Install Python dependencies
        run: |
          set -e

          echo "=============================================="
          echo "PYTHON DEPENDENCIES"
          echo "=============================================="

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            -r requirements.txt

      - name: Syntax check
        run: |
          set -e

          echo "=============================================="
          echo "SYNTAX CHECK"
          echo "=============================================="

          python3 -m py_compile processor.py

          echo "Python syntax OK"

      - name: Run processor
        run: |
          set -e

          echo "=============================================="
          echo "START PROCESSOR"
          echo "=============================================="

          python3 processor.py

      - name: Validate output
        run: |
          set -e

          echo "=============================================="
          echo "VALIDATING OUTPUT"
          echo "=============================================="

          test -f data/grid.geojson
          test -f data/summary.json
          test -d data/chunks

          CHUNK_COUNT=$(find data/chunks \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name 'PUNE_*' \
            | wc -l)

          echo
          echo "Chunk count: ${CHUNK_COUNT}"

          if [ "${CHUNK_COUNT}" -le 0 ]; then
            echo "ERROR: No chunks generated"
            exit 1
          fi

          echo
          echo "SUMMARY:"
          cat data/summary.json

          echo
          echo "CHUNK FILES:"

          find data/chunks \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | head -300

      - name: Prepare artifact
        run: |
          set -e

          echo "=============================================="
          echo "PREPARING ARTIFACT"
          echo "=============================================="

          rm -rf artifact

          mkdir -p artifact

          cp -r data/chunks \
            artifact/chunks

          cp data/grid.geojson \
            artifact/grid.geojson

          cp data/summary.json \
            artifact/summary.json

          echo
          echo "ARTIFACT SIZE:"

          du -sh artifact

          echo
          echo "ARTIFACT FILES:"

          find artifact \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | head -300

      - name: Upload processor artifact
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Final report
        run: |
          echo
          echo "=============================================="
          echo "PROCESSOR WORKFLOW COMPLETED"
          echo "=============================================="

          echo
          echo "COMMIT:"
          git rev-parse HEAD

          echo
          echo "SUMMARY:"
          cat data/summary.json
