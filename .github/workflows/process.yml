name: Process Pune 1km Chunks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download OSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw

          gh release download pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw

          ls -lh raw

      - name: Process Pune
        env:
          RAW_DIR: raw
          OSM_FILE: raw/central-zone.osm.pbf
          OUTPUT_DIR: data/chunks
          CHUNK_SIZE_M: "1000"
          BBOX: "73.70,18.40,74.05,18.70"
        run: |
          python processor.py

      - name: Verify output
        run: |
          echo "========================================"
          echo "VERIFYING OUTPUT"
          echo "========================================"

          test -f data/chunks/grid.geojson
          test -f data/chunks/summary.json

          echo
          echo "Chunk count:"
          find data/chunks -mindepth 1 -maxdepth 1 -type d | wc -l

          echo
          echo "Buildings files:"
          find data/chunks -name buildings.geojson | wc -l

          echo
          echo "Road files:"
          find data/chunks -name roads.geojson | wc -l

          echo
          echo "Waterway files:"
          find data/chunks -name waterways.geojson | wc -l

          echo
          echo "Summary:"
          cat data/chunks/summary.json

      - name: Upload processed artifact
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: |
            data/chunks/
            pune-1km-chunks.tar.gz
          if-no-files-found: error
          retention-days: 30
