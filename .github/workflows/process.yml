name: Process Pune 1km Chunks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    name: Process Pune OSM Data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # Install osmium-tool
      # ------------------------------------------------------

      - name: Install osmium-tool
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool

          echo
          echo "osmium version:"
          osmium --version

      # ------------------------------------------------------
      # Python dependencies
      # ------------------------------------------------------

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            -r requirements.txt

          echo
          echo "Installed packages:"
          pip list

      # ------------------------------------------------------
      # Runner information
      # ------------------------------------------------------

      - name: Show runner resources
        run: |
          echo "=========================================="
          echo "RUNNER"
          echo "=========================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h

      # ------------------------------------------------------
      # Download OSM
      # ------------------------------------------------------

      - name: Download Pune OSM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p raw

          echo "Downloading central-zone.osm.pbf..."

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw

          echo
          echo "Downloaded:"
          ls -lh raw

          test -f raw/central-zone.osm.pbf

          echo
          echo "Disk:"
          df -h

      # ------------------------------------------------------
      # Process
      # ------------------------------------------------------

      - name: Process Pune OSM
        env:
          RAW_DIR: raw
          OSM_FILE: raw/central-zone.osm.pbf

          OUTPUT_DIR: data/chunks
          TEMP_DIR: data/.processor_tmp

          CHUNK_SIZE_M: "1000"

          BBOX: "73.70,18.40,74.05,18.70"

          PROGRESS_EVERY: "50000"

        run: |
          set -e

          echo "=========================================="
          echo "STARTING PROCESSOR"
          echo "=========================================="

          echo
          echo "Configuration:"
          echo "OSM_FILE=$OSM_FILE"
          echo "OUTPUT_DIR=$OUTPUT_DIR"
          echo "TEMP_DIR=$TEMP_DIR"
          echo "CHUNK_SIZE_M=$CHUNK_SIZE_M"
          echo "BBOX=$BBOX"

          echo
          echo "Disk before processing:"
          df -h

          echo
          echo "Starting..."
          echo

          python -u processor.py

      # ------------------------------------------------------
      # Verify
      # ------------------------------------------------------

      - name: Verify output
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING OUTPUT"
          echo "=========================================="

          test -d data/chunks
          test -f data/chunks/grid.geojson
          test -f data/chunks/summary.json
          test -f pune-1km-chunks.tar.gz

          echo
          echo "Chunk directories:"
          find data/chunks \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | wc -l

          echo
          echo "Buildings files:"
          find data/chunks \
            -name buildings.geojson \
            -type f \
            | wc -l

          echo
          echo "Road files:"
          find data/chunks \
            -name roads.geojson \
            -type f \
            | wc -l

          echo
          echo "Waterway files:"
          find data/chunks \
            -name waterways.geojson \
            -type f \
            | wc -l

          echo
          echo "Metadata files:"
          find data/chunks \
            -name metadata.json \
            -type f \
            | wc -l

          echo
          echo "Summary:"
          cat data/chunks/summary.json

          echo
          echo "Archive:"
          ls -lh pune-1km-chunks.tar.gz

      # ------------------------------------------------------
      # Sample chunk
      # ------------------------------------------------------

      - name: Inspect sample chunk
        run: |
          set -e

          echo "=========================================="
          echo "SAMPLE CHUNK"
          echo "=========================================="

          SAMPLE=$(
            find data/chunks \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort \
              | head -1
          )

          echo
          echo "Chunk:"
          echo "$SAMPLE"

          echo
          echo "Files:"
          ls -lh "$SAMPLE"

          echo
          echo "Metadata:"
          cat "$SAMPLE/metadata.json"

          echo
          echo "Building GeoJSON:"
          wc -c "$SAMPLE/buildings.geojson"

          echo
          echo "Road GeoJSON:"
          wc -c "$SAMPLE/roads.geojson"

          echo
          echo "Waterway GeoJSON:"
          wc -c "$SAMPLE/waterways.geojson"

      # ------------------------------------------------------
      # Final disk
      # ------------------------------------------------------

      - name: Show final disk
        run: |
          echo "=========================================="
          echo "FINAL DISK"
          echo "=========================================="

          df -h

          echo
          echo "Output size:"
          du -sh data/chunks

          echo
          echo "Archive:"
          du -h pune-1km-chunks.tar.gz

      # ------------------------------------------------------
      # Artifact
      # ------------------------------------------------------

      - name: Upload processed artifact
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: |
            data/chunks/
            pune-1km-chunks.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
