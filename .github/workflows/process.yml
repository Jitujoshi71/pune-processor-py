name: Process Pune 1km Chunks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system information
        run: |
          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          uname -a
          echo

          echo "CPU:"
          nproc
          echo

          echo "MEMORY:"
          free -h
          echo

          echo "DISK:"
          df -h
          echo

      - name: Install osmium
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool

          echo
          osmium version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            -r requirements.txt

      - name: Download Pune raw release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING RAW DATA"
          echo "=========================================="

          mkdir -p raw

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw \
            --clobber

          echo
          echo "Downloaded:"
          ls -lh raw/

      - name: Validate input PBF
        run: |
          set -e

          test -f raw/central-zone.osm.pbf

          echo "PBF:"
          ls -lh raw/central-zone.osm.pbf

          echo
          echo "OSM INFO:"
          osmium fileinfo \
            raw/central-zone.osm.pbf \
            --extended

      - name: Run Pune processor
        run: |
          set -e

          python -u processor.py

      - name: Inspect output
        if: always()
        run: |
          echo "=========================================="
          echo "OUTPUT"
          echo "=========================================="

          if [ -d data ]; then
            find data \
              -maxdepth 3 \
              -type f \
              -printf '%p %k KB\n' \
              | sort \
              | head -200
          fi

          echo
          echo "SUMMARY:"

          if [ -f data/summary.json ]; then
            cat data/summary.json
          fi

          echo
          echo "ARCHIVE:"

          if [ -f pune-1km-chunks.tar.gz ]; then
            ls -lh pune-1km-chunks.tar.gz
          fi

      - name: Upload processed chunks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: |
            pune-1km-chunks.tar.gz
            data/grid.geojson
            data/summary.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
