name: Process Pune 1km Chunks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout processor
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Pune raw release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw

          gh release download pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw

          echo "Downloaded files:"
          ls -lh raw

      - name: Run processor
        env:
          RAW_DIR: raw
          OSM_FILE: raw/central-zone.osm.pbf

          # Pune-wide processing area
          BBOX: "73.70,18.40,74.05,18.70"

          CHUNK_SIZE_M: "1000"
          OUTPUT_DIR: "data/chunks"

        run: |
          python processor.py

      - name: Show output
        run: |
          echo "======================================"
          echo "OUTPUT"
          echo "======================================"

          du -sh data/chunks || true

          echo
          echo "Example chunk files:"
          find data/chunks -maxdepth 2 -type f | head -50

          echo
          echo "Summary:"
          cat data/chunks/summary.json

      - name: Upload processed chunks
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: |
            data/chunks/
            pune-1km-chunks.tar.gz
          if-no-files-found: error
          retention-days: 30
