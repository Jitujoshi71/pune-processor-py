name: Pune 1KM Processor v8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source
        run: |
          set -e

          echo "=============================================="
          echo "COMMIT"
          echo "=============================================="

          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=============================================="
          echo "PROCESSOR FILE"
          echo "=============================================="

          test -f processor.py
          ls -lh processor.py

          echo
          echo "=============================================="
          echo "WORKFLOW"
          echo "=============================================="

          test -f .github/workflows/process.yml
          ls -lh .github/workflows/process.yml

          echo
          echo "=============================================="
          echo "PROCESSOR HEADER"
          echo "=============================================="

          head -25 processor.py

      # ============================================================
      # INSTALL OSMIUM
      # ============================================================

      - name: Install system packages
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL SYSTEM PACKAGES"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool \
            python3 \
            python3-pip

          echo
          echo "OSMIUM VERSION"
          osmium --version

          echo
          echo "PYTHON VERSION"
          python3 --version

      # ============================================================
      # DOWNLOAD RAW PBF
      # ============================================================

      - name: Download raw PBF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=============================================="
          echo "DOWNLOAD RAW PBF"
          echo "=============================================="

          mkdir -p raw

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw \
            --clobber

          test -s raw/central-zone.osm.pbf

          echo
          echo "RAW PBF:"
          ls -lh raw/central-zone.osm.pbf

      # ============================================================
      # VERIFY RAW PBF
      # ============================================================

      - name: Verify raw PBF
        run: |
          set -e

          echo "=============================================="
          echo "RAW PBF FILEINFO"
          echo "=============================================="

          osmium fileinfo raw/central-zone.osm.pbf

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL PYTHON DEPENDENCIES"
          echo "=============================================="

          python3 -m pip install --upgrade pip

          python3 -m pip install -r requirements.txt

      # ============================================================
      # PYTHON SYNTAX CHECK
      # ============================================================

      - name: Syntax check
        run: |
          set -e

          echo "=============================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=============================================="

          python3 -m py_compile processor.py

          echo "Python syntax OK"

      # ============================================================
      # RUN PROCESSOR
      # ============================================================

      - name: Run processor
        run: |
          set -e

          echo "=============================================="
          echo "START PROCESSOR"
          echo "=============================================="

          python3 processor.py

      # ============================================================
      # VALIDATE OUTPUT
      # ============================================================

      - name: Validate output
        run: |
          set -e

          echo "=============================================="
          echo "VALIDATING OUTPUT"
          echo "=============================================="

          test -f data/grid.geojson
          test -f data/summary.json

          test -d data/chunks

          CHUNK_COUNT=$(find data/chunks \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name 'PUNE_*' \
            | wc -l)

          echo "Chunk count: ${CHUNK_COUNT}"

          if [ "${CHUNK_COUNT}" -le 0 ]; then
            echo "ERROR: No chunks generated"
            exit 1
          fi

          echo
          echo "SUMMARY:"
          cat data/summary.json

          echo
          echo "CHUNKS:"
          find data/chunks \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | head -200

      # ============================================================
      # CREATE ARTIFACT
      # ============================================================

      - name: Prepare artifact
        run: |
          set -e

          echo "=============================================="
          echo "PREPARING ARTIFACT"
          echo "=============================================="

          rm -rf artifact
          mkdir -p artifact

          cp -r data/chunks artifact/chunks
          cp data/grid.geojson artifact/grid.geojson
          cp data/summary.json artifact/summary.json

          echo
          echo "ARTIFACT SIZE:"
          du -sh artifact

          echo
          echo "ARTIFACT FILES:"
          find artifact \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | head -300

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload processor artifact
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # ============================================================
      # FINAL
      # ============================================================

      - name: Final report
        run: |
          echo
          echo "=============================================="
          echo "PROCESSOR WORKFLOW COMPLETED"
          echo "=============================================="

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Summary:"
          cat data/summary.json
