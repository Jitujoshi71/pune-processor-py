      - name: Inspect actual Osmium GeoJSON
        run: |
          set -e

          echo "=============================================="
          echo "BUILDINGS SAMPLE"
          echo "=============================================="

          head -n 5 data/.processor_tmp/buildings.geojsonseq

          echo
          echo "=============================================="
          echo "ROADS SAMPLE"
          echo "=============================================="

          head -n 5 data/.processor_tmp/roads.geojsonseq

          echo
          echo "=============================================="
          echo "WATERWAYS SAMPLE"
          echo "=============================================="

          head -n 5 data/.processor_tmp/waterways.geojsonseq

          echo
          echo "=============================================="
          echo "PYTHON GEOMETRY DIAGNOSTIC"
          echo "=============================================="

          python3 - <<'PY'
          import json
          from shapely.geometry import shape, box

          BBOX = box(73.7, 18.4, 74.05, 18.7)

          files = [
              ("BUILDINGS", "data/.processor_tmp/buildings.geojsonseq"),
              ("ROADS", "data/.processor_tmp/roads.geojsonseq"),
              ("WATERWAYS", "data/.processor_tmp/waterways.geojsonseq"),
          ]

          for name, filename in files:
              print()
              print("=" * 70)
              print(name)
              print("=" * 70)

              with open(filename, "r", encoding="utf-8") as f:
                  for i, line in enumerate(f):
                      if i >= 5:
                          break

                      obj = json.loads(line)

                      print()
                      print("FEATURE:", i + 1)
                      print("type:", obj.get("type"))
                      print("geometry type:",
                            (obj.get("geometry") or {}).get("type"))

                      props = obj.get("properties", {})

                      print("properties:")
                      print(json.dumps(
                          props,
                          ensure_ascii=False,
                          indent=2
                      )[:3000])

                      geometry = obj.get("geometry")

                      if geometry:
                          try:
                              g = shape(geometry)

                              print("bounds:", g.bounds)
                              print("centroid:", (
                                  g.centroid.x,
                                  g.centroid.y
                              ))
                              print(
                                  "intersects Pune:",
                                  g.intersects(BBOX)
                              )

                          except Exception as e:
                              print("GEOMETRY ERROR:", repr(e))
          PY
