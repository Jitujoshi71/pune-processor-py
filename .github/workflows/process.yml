name: Pune 1KM Processor v7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify source
        run: |
          set -e

          echo "=============================================="
          echo "COMMIT"
          echo "=============================================="

          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "PROCESSOR:"
          test -f processor.py
          head -20 processor.py

          echo
          echo "CHECKING FOR OLD EXTRACT COMMAND:"
          if grep -nE 'osmium[[:space:]]+extract' processor.py; then
            echo "ERROR: old extract command found"
            exit 1
          fi

          echo "No osmium extract command in processor.py"

      - name: Install system packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool \
            python3 \
            python3-pip

          echo
          osmium --version
          python3 --version

      - name: Download raw PBF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p raw

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw \
            --clobber

          test -s raw/central-zone.osm.pbf

          ls -lh raw/central-zone.osm.pbf

      - name: Install Python dependencies
        run: |
          set -e

          python3 -m pip install \
            --upgrade pip

          python3 -m pip install \
            -r requirements.txt

      - name: Syntax check
        run: |
          set -e

          python3 -m py_compile processor.py

          echo "Python syntax OK"

      - name: Run processor
        run: |
          set -e

          python3 processor.py

      - name: Validate output
        run: |
          set -e

          echo "=============================================="
          echo "OUTPUT VALIDATION"
          echo "=============================================="

          test -d data/chunks
          test -f data/grid.geojson
          test -f data/summary.json
          test -s pune-1km-chunks.tar.gz

          CHUNKS=$(find data/chunks \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | wc -l)

          BUILDINGS=$(find data/chunks \
            -name "buildings.geojson" \
            | wc -l)

          ROADS=$(find data/chunks \
            -name "roads.geojson" \
            | wc -l)

          WATERWAYS=$(find data/chunks \
            -name "waterways.geojson" \
            | wc -l)

          echo "CHUNKS: $CHUNKS"
          echo "BUILDINGS: $BUILDINGS"
          echo "ROADS: $ROADS"
          echo "WATERWAYS: $WATERWAYS"

          test "$CHUNKS" -gt 0
          test "$BUILDINGS" -gt 0
          test "$ROADS" -gt 0

          echo
          echo "VALIDATION PASSED"

      - name: Show summary
        run: |
          echo "=============================================="
          echo "SUMMARY"
          echo "=============================================="

          cat data/summary.json

          echo
          echo "DATA SIZE:"
          du -sh data

          echo
          echo "SAMPLE:"
          find data/chunks \
            -maxdepth 2 \
            -type f \
            | head -100

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks-v7
          path: |
            data/
            pune-1km-chunks.tar.gz
          if-no-files-found: error
          retention-days: 7
