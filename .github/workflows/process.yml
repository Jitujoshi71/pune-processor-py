name: Process Pune 1km Chunks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: System information
        run: |
          set -e

          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "DISK:"
          df -h

      - name: Install osmium
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            osmium-tool

          osmium version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          set -e

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements.txt

      - name: Download raw PBF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p raw

          gh release download \
            pune-raw-v1 \
            --repo Jitujoshi71/pune_raw_py \
            --pattern "central-zone.osm.pbf" \
            --dir raw \
            --clobber

          test -f raw/central-zone.osm.pbf

          ls -lh \
            raw/central-zone.osm.pbf

      - name: Validate PBF
        run: |
          set -e

          osmium fileinfo \
            raw/central-zone.osm.pbf \
            --extended

      - name: Run processor
        run: |
          set -e

          python -u processor.py

      - name: Verify output
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "VERIFYING OUTPUT"
          echo "=========================================="

          if [ -d data/chunks ]; then

            echo
            echo "CHUNK COUNT:"

            find data/chunks \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | wc -l

            echo
            echo "FIRST CHUNKS:"

            find data/chunks \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort \
              | head -20

            echo
            echo "SAMPLE FILES:"

            find data/chunks \
              -type f \
              | sort \
              | head -50

          else

            echo "ERROR: data/chunks missing"

          fi

          echo
          echo "SUMMARY:"

          if [ -f data/summary.json ]; then
            cat data/summary.json
          fi

          echo
          echo "ARCHIVE:"

          if [ -f pune-1km-chunks.tar.gz ]; then
            ls -lh pune-1km-chunks.tar.gz
          fi

      - name: Upload processed data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pune-1km-chunks
          path: |
            pune-1km-chunks.tar.gz
            data/grid.geojson
            data/summary.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
